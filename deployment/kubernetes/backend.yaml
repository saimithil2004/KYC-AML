apiVersion: apps/v1
kind: Deployment
metadata:
  name: aml-backend-api
  namespace: aml-compliance
  labels:
    app: aml-backend-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: aml-backend-api
  template:
    metadata:
      labels:
        app: aml-backend-api
    spec:
      containers:
        - name: api
          image: aml-backend-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: aml-config
            - secretRef:
                name: aml-secrets
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: "200m"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /api/v1/health/startup
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aml-backend-api-svc
  namespace: aml-compliance
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: aml-backend-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aml-backend-api-hpa
  namespace: aml-compliance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aml-backend-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aml-backend-api-pdb
  namespace: aml-compliance
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: aml-backend-api
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aml-resource-quota
  namespace: aml-compliance
spec:
  hard:
    pods: "20"
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "10"
    limits.memory: "16Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: aml-limit-range
  namespace: aml-compliance
spec:
  limits:
    - default:
        cpu: "500m"
        memory: 512Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      type: Container
