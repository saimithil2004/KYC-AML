apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aml-ingress
  namespace: aml-compliance
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  rules:
    - host: compliance.enterprise.com
      http:
        paths:
          # Backend API Routing (matches /api/v1/* and forwards to /api/v1/*)
          - path: /api/v1/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: aml-backend-api-svc
                port:
                  number: 8000
          # Frontend static/page Routing (matches all other requests)
          - path: /?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: aml-frontend-svc
                port:
                  number: 3000
