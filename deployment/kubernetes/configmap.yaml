apiVersion: v1
kind: ConfigMap
metadata:
  name: aml-config
  namespace: aml-compliance
data:
  ENV: "production"
  LOG_LEVEL: "INFO"
  REDIS_SENTINEL_SERVICE_NAME: "mymaster"
  KUBERNETES_NAMESPACE: "aml-compliance"
  PROMETHEUS_METRICS_ENABLED: "true"
  RATE_LIMIT_ENABLED: "true"
  BACKUP_RETENTION_DAYS: "30"
  MAX_UPLOAD_SIZE_MB: "10"
