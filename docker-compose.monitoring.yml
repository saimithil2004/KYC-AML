version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: aml_prometheus
    restart: always
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - aml_prod_network
      - aml_monitoring_network

  grafana:
    image: grafana/grafana:10.3.1
    container_name: aml_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_monitoring_pass
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - aml_prod_network
      - aml_monitoring_network

  loki:
    image: grafana/loki:2.9.4
    container_name: aml_loki
    restart: always
    volumes:
      - ./deployment/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - aml_monitoring_network

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: aml_alertmanager
    restart: always
    volumes:
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - aml_monitoring_network

  node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: aml_node_exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - aml_monitoring_network

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: aml_postgres_exporter
    restart: always
    environment:
      - DATA_SOURCE_NAME=postgresql://compliance_admin:SecretSecurePassword99@postgres_primary:5432/aml_compliance_db?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - prometheus
    networks:
      - aml_prod_network
      - aml_monitoring_network

  redis_exporter:
    image: oliver006/redis_exporter:v1.57.0
    container_name: aml_redis_exporter
    restart: always
    environment:
      - REDIS_ADDR=redis://redis_master:6379
    ports:
      - "9121:9121"
    depends_on:
      - prometheus
    networks:
      - aml_prod_network
      - aml_monitoring_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: aml_cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - aml_monitoring_network

networks:
  aml_prod_network:
    external: true
    name: aml_prod_network
  aml_monitoring_network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
