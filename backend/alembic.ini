# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration files
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file as well as the filename.
# string_args = utc

# logging configuration (optional)
# [loggers], [handlers], [formatters] section mappings below

sqlalchemy.url = postgresql+asyncpg://compliance_admin:SecretSecurePassword99@postgres:5432/aml_compliance_db

[post_write_hooks]
# post_write_hooks allow scripts to be run after a new migration script is generated.
# example hooks include running black/flake8/ruff formatting on new migration files.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
