name: Docker Image Validation Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'docker-compose*'
  pull_request:
    branches: [ main, master ]

jobs:
  validate-images:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Validate Backend Docker Build (Dry Run)
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Validate Frontend Docker Build (Dry Run)
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
